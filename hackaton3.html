<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Hackathon 2026 - Register</title>
</head>
<body>
  <header>
    <h1>Hackathon 2026</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="hackaton.html">About</a> |
      <a href="hackaton2.html">Gallery</a> |
      <a href="hackaton3.html">Register</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Team registration</h2>
      <form id="register" action="#" method="post">
        <fieldset>
          <legend>Your details</legend>
          <p><label for="fullname">Full name:</label>
             <input type="text" id="fullname" name="fullname" placeholder="Your full name" required /></p>
          <p><label for="email">Email:</label>
             <input type="email" id="email" name="email" required /></p>
          <p><label for="password">Password:</label>
             <input type="password" id="password" name="password" /></p>
        </fieldset>

        <fieldset>
          <legend>Experience</legend>
          <p>Level:
            <input type="radio" id="beginner" name="level" value="beginner" />
            <label for="beginner">Beginner</label>
            <input type="radio" id="advanced" name="level" value="advanced" />
            <label for="advanced">Advanced</label>
          </p>
          <p>Interests:
            <input type="checkbox" id="web" name="interest" value="web" />
            <label for="web">Web</label>
            <input type="checkbox" id="ai" name="interest" value="ai" />
            <label for="ai">AI</label>
          </p>
          <p><label for="track">Track:</label>
            <select id="track" name="track">
              <option value="">Choose...</option>
              <optgroup label="Software">
                <option value="webapp">Web app</option>
                <option value="mobile">Mobile app</option>
              </optgroup>
              <optgroup label="Data">
                <option value="data">AI / Data</option>
              </optgroup>
            </select></p>
          <p><label for="idea">Your idea:</label><br/>
             <textarea id="idea" name="idea" rows="4" cols="40"></textarea></p>
        </fieldset>

        <input value="Register" type="submit" />
        <input value="Clear" type="reset" />
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Hackathon team</p>
  </footer>
</body>
</html>
